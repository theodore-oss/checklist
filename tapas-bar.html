<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Tapas Bar — Rosario</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --card: #ffffff;
    --line: #e4ddd1;
    --accent: #b3401f;
    --accent-soft: #f4e2da;
    --ok: #4c7a4c;
    --muted: #8a8378;
    --success: #2f6d46;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .header-main { min-width: 0; }
  .lang-switch { display: flex; gap: 4px; flex-shrink: 0; }
  .lang-switch button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 5px 9px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .lang-switch button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .identity { display: grid; gap: 14px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 6px; }
  input[type="date"], input[type="text"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
    background: var(--paper);
    color: var(--ink);
    font-family: inherit;
  }
  textarea { min-height: 120px; resize: vertical; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .comments-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .comments-hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }

  .progress-wrap { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 10px 0 14px; }
  .progress-bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
  .progress-label { font-size: 12px; color: var(--muted); margin-top: 6px; text-align: right; }

  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); margin: 0 0 12px; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .task:last-child { border-bottom: none; }
  .task-group:last-child .task:last-child { border-bottom: none; }
  .task.has-sub { border-bottom: none; }
  .task input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 1px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .task label {
    font-size: 14.5px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    color: var(--ink);
    line-height: 1.4;
    margin: 0;
    cursor: pointer;
  }
  .task.done label { color: var(--muted); text-decoration: line-through; }

  .subtasks { margin: 0 0 4px 32px; padding-left: 14px; border-left: 2px solid var(--accent-soft); }
  .subtasks .task { padding: 7px 0; border-bottom: none; }
  .subtasks .task input[type="checkbox"] { width: 17px; height: 17px; }
  .subtasks .task label { font-size: 13.5px; color: var(--muted); }
  .subtasks .task.done label { text-decoration: line-through; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button {
    flex: 1;
    min-width: 140px;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .status {
    font-size: 12.5px;
    color: var(--ok);
    text-align: center;
    margin-top: 10px;
    min-height: 16px;
  }
  footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; }
  .brand-mark { display: block; height: 30px; width: auto; margin: 0 auto 10px; }

  .inform-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 0;
    cursor: pointer;
    text-transform: none;
    letter-spacing: normal;
    font-weight: 500;
    color: var(--ink);
  }
  .inform-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  .inform-row span { font-size: 13.5px; }

  .success-screen {
    position: fixed;
    inset: 0;
    background: var(--success);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    z-index: 100;
  }
  .success-screen.visible { display: flex; }
  .success-title { font-size: 52px; font-weight: 900; color: white; margin: 18px 0 10px; line-height: 1.05; }
  .success-sub { font-size: 14px; color: rgba(255,255,255,0.85); margin: 0; max-width: 280px; }
  .success-close {
    margin-top: 24px;
    background: none;
    color: rgba(255,255,255,0.75);
    border: none;
    padding: 6px 10px;
    font-weight: 500;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-main">
      <div class="eyebrow" id="eyebrowText">Rosario · Checklist quotidienne</div>
      <h1 id="pageTitle">Opening Tapas Bar</h1>
      <p class="subtitle" id="subtitleText">Rosario — Checklist d'ouverture, bar à tapas</p>
    </div>
    <div class="lang-switch">
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div class="card identity">
    <div>
      <label for="date" id="dateLabelText">Date</label>
      <input type="date" id="date">
    </div>
    <div>
      <label for="employee" id="employeeLabelText">Nom de l'employé</label>
      <input type="text" id="employee" placeholder="Prénom Nom">
    </div>
    <div>
      <label for="service" id="serviceLabelText">Service</label>
      <select id="service">
        <option value="" id="serviceDefaultOption">— Sélectionner —</option>
        <option value="Midi" id="serviceMidiOption">Midi</option>
        <option value="Soir" id="serviceSoirOption">Soir</option>
      </select>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 tâches faites</div>
  </div>

  <div id="sections"></div>

  <div class="card">
    <p class="comments-title" id="commentsTitleText">Commentaires</p>
    <textarea id="comments" placeholder="Un souci, un manque, quelque chose a signaler a l'equipe ?"></textarea>
    <label class="inform-row" for="informManager">
      <input type="checkbox" id="informManager">
      <span id="informLabelText">Informer le manager ?</span>
    </label>
  </div>

  <div class="card">
    <div class="actions">
      <button class="btn-secondary" id="resetBtn" type="button">Réinitialiser</button>
      <button class="btn-primary" id="validateBtn" type="button">Valider la checklist</button>
    </div>
    <div class="status" id="statusMsg"></div>
  </div>

  const RECIPIENTS = "adrien@grupodomingo.io,theodore@grupodomingo.io,andrea@grupodomingo.io";
  const OK_RECIPIENT = "adrien@grupodomingo.io,theodore@grupodomingo.io,andrea@grupodomingo.io";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz71CiJkrDMhr4r6zLaIOR8vTi076ju760QLlL42UGohQWFq7nnU_kDp_jkH349edyM/exec";

  const dateInput = document.getElementById("date");
  const employeeInput = document.getElementById("employee");
  const serviceInput = document.getElementById("service");
  const commentsInput = document.getElementById("comments");
  const informManagerInput = document.getElementById("informManager");
  const successScreen = document.getElementById("successScreen");
  const sectionsEl = document.getElementById("sections");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");
  const statusMsg = document.getElementById("statusMsg");

  const I18N = {
    fr: {
      eyebrow: "Rosario · Checklist quotidienne",
      dateLabel: "Date",
      employeeLabel: "Nom de l'employé",
      serviceLabel: "Service",
      serviceDefault: "— Sélectionner —",
      serviceMidi: "Midi",
      serviceSoir: "Soir",
      commentsTitle: "Commentaires",
      commentsPlaceholder: "Un souci, un manque, quelque chose a signaler a l'equipe ?",
      informLabel: "Informer le manager ?",
      resetBtn: "Réinitialiser",
      validateBtn: "Valider la checklist",
      resetConfirm: "Réinitialiser toutes les cases de cette checklist pour cette date ?",
      progress: (done, total) => done + " / " + total + " tâches faites",
      successSub: "Checklist validée — merci ! Un récap part à Adrien.",
      successClose: "Retour à la checklist",
      footer: "Domingo — Rosario · sauvegarde automatique sur cet appareil",
      alertMissing: "Des tâches manquent — un email d'alerte a été envoyé.",
      alertInformed: "Le manager a été informé par email.",
      alertSending: "Envoi en cours…",
      alertFallback: "Connexion impossible — un brouillon d'email a été ouvert à la place.",
    },
    en: {
      eyebrow: "Rosario · Daily checklist",
      dateLabel: "Date",
      employeeLabel: "Employee name",
      serviceLabel: "Service",
      serviceDefault: "— Select —",
      serviceMidi: "Lunch",
      serviceSoir: "Dinner",
      commentsTitle: "Comments",
      commentsPlaceholder: "Any issue, anything missing, something to flag to the team?",
      informLabel: "Inform the manager?",
      resetBtn: "Reset",
      validateBtn: "Validate checklist",
      resetConfirm: "Reset all checkboxes on this checklist for this date?",
      progress: (done, total) => done + " / " + total + " tasks done",
      successSub: "Checklist validated — thank you! A recap is on its way to Adrien.",
      successClose: "Back to checklist",
      footer: "Domingo — Rosario · auto-saved on this device",
      alertMissing: "Some tasks are missing — an alert email has been sent.",
      alertInformed: "The manager has been informed by email.",
      alertSending: "Sending…",
      alertFallback: "Couldn't connect — an email draft was opened instead.",
    },
  };

  let currentLang = localStorage.getItem("rosario_checklist_lang") || "fr";

  function applyLang(lang) {
    currentLang = lang;
    localStorage.setItem("rosario_checklist_lang", lang);
    const t = I18N[lang];
    document.getElementById("eyebrowText").textContent = t.eyebrow;
    document.getElementById("pageTitle").textContent = (lang === "fr") ? LIST_TITLE_FR : LIST_TITLE;
    document.getElementById("subtitleText").textContent = (lang === "fr") ? SUBTITLE_FR : SUBTITLE_EN;
    document.getElementById("dateLabelText").textContent = t.dateLabel;
    document.getElementById("employeeLabelText").textContent = t.employeeLabel;
    document.getElementById("serviceLabelText").textContent = t.serviceLabel;
    document.getElementById("serviceDefaultOption").textContent = t.serviceDefault;
    document.getElementById("serviceMidiOption").textContent = t.serviceMidi;
    document.getElementById("serviceSoirOption").textContent = t.serviceSoir;
    document.getElementById("commentsTitleText").textContent = t.commentsTitle;
    commentsInput.placeholder = t.commentsPlaceholder;
    document.getElementById("informLabelText").textContent = t.informLabel;
    document.getElementById("resetBtn").textContent = t.resetBtn;
    document.getElementById("validateBtn").textContent = t.validateBtn;
    document.getElementById("successSubText").textContent = t.successSub;
    document.getElementById("successCloseBtn").textContent = t.successClose;
    document.getElementById("footerText").textContent = t.footer;
    document.querySelectorAll(".lang-switch button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    document.querySelectorAll("[data-fr]").forEach(el => {
      el.textContent = (lang === "fr") ? el.dataset.fr : el.dataset.en;
    });
    updateProgress();
  }

  document.querySelectorAll(".lang-switch button").forEach(b => {
    b.addEventListener("click", () => applyLang(b.dataset.lang));
  });

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function currentPeriod() {
    // Same link is used once at lunch and once at dinner: from 3pm local time
    // onward it points at a fresh, empty slot so the dinner team starts from zero.
    return (new Date().getHours() < 15) ? "midi" : "soir";
  }

  function storageKey(dateVal) {
    return "rosario_checklist_v2_" + LIST_ID + "_" + dateVal + "_" + currentPeriod();
  }

  function normalizeTask(t) {
    return { en: t.en, fr: t.fr || t.en, sub: (t.sub || []).map(s => ({ en: s.en, fr: s.fr || s.en })) };
  }

  const SECTION_NAME_FR = {
    "Dining room": "Salle",
    "Consoles": "Consoles",
    "Other": "Autre",
    "Bathrooms": "Toilettes",
    "Tapas": "Tapas",
    "Postres": "Postres",
  };

  let subGroups = [];

  function buildSections() {
    sectionsEl.innerHTML = "";
    subGroups = [];
    Object.entries(DATA).forEach(([sectionName, rawTasks]) => {
      const card = document.createElement("div");
      card.className = "card task-group";
      const h = document.createElement("div");
      h.className = "section-title";
      h.textContent = sectionName;
      h.dataset.en = sectionName;
      h.dataset.fr = SECTION_NAME_FR[sectionName] || sectionName;
      card.appendChild(h);
      const tasks = rawTasks.map(normalizeTask);
      tasks.forEach((task, i) => {
        const row = document.createElement("div");
        row.className = "task";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        const secKey = sectionName.replace(/\s+/g,"_");
        const id = "t_" + secKey + "_" + i;
        cb.id = id;
        cb.dataset.section = sectionName;
        cb.dataset.path = String(i);
        const lbl = document.createElement("label");
        lbl.htmlFor = id;
        lbl.textContent = task.en;
        lbl.dataset.en = task.en;
        lbl.dataset.fr = task.fr;
        cb.addEventListener("change", () => {
          row.classList.toggle("done", cb.checked);
          updateProgress();
          save();
        });
        row.appendChild(cb);
        row.appendChild(lbl);
        card.appendChild(row);

        if (task.sub && task.sub.length) {
          row.classList.add("has-sub");
          const subWrap = document.createElement("div");
          subWrap.className = "subtasks";
          const group = { parentCb: cb, parentRow: row, subCbs: [] };
          subGroups.push(group);
          task.sub.forEach((subItem, j) => {
            const subRow = document.createElement("div");
            subRow.className = "task";
            const subCb = document.createElement("input");
            subCb.type = "checkbox";
            const subId = "t_" + secKey + "_" + i + "_s" + j;
            subCb.id = subId;
            subCb.dataset.section = sectionName;
            subCb.dataset.path = i + "_s" + j;
            const subLbl = document.createElement("label");
            subLbl.htmlFor = subId;
            subLbl.textContent = subItem.en;
            subLbl.dataset.en = subItem.en;
            subLbl.dataset.fr = subItem.fr;
            subCb.addEventListener("change", () => {
              subRow.classList.toggle("done", subCb.checked);
              syncParentFromSubs(group);
              updateProgress();
              save();
            });
            subRow.appendChild(subCb);
            subRow.appendChild(subLbl);
            subWrap.appendChild(subRow);
            group.subCbs.push(subCb);
          });
          card.appendChild(subWrap);
        }
      });
      sectionsEl.appendChild(card);
    });
  }

  function syncParentFromSubs(group) {
    const allChecked = group.subCbs.length > 0 && group.subCbs.every(sc => sc.checked);
    group.parentCb.checked = allChecked;
    group.parentRow.classList.toggle("done", allChecked);
  }

  function syncAllParents() {
    subGroups.forEach(syncParentFromSubs);
  }

  function allCheckboxes() {
    return Array.from(document.querySelectorAll('.task input[type="checkbox"]'));
  }

  function updateProgress() {
    const boxes = allCheckboxes();
    const done = boxes.filter(b => b.checked).length;
    const total = boxes.length;
    progressFill.style.width = total ? (done/total*100) + "%" : "0%";
    progressLabel.textContent = I18N[currentLang].progress(done, total);
  }

  function save() {
    const dateVal = dateInput.value || todayISO();
    const state = {
      employee: employeeInput.value,
      service: serviceInput.value,
      comments: commentsInput.value,
      informManager: informManagerInput.checked,
      checks: {}
    };
    allCheckboxes().forEach(cb => {
      state.checks[cb.dataset.section + "|" + cb.dataset.path] = cb.checked;
    });
    localStorage.setItem(storageKey(dateVal), JSON.stringify(state));
    statusMsg.textContent = "Sauvegardé automatiquement";
    setTimeout(() => { statusMsg.textContent = ""; }, 1500);
  }

  function load() {
    const dateVal = dateInput.value || todayISO();
    const raw = localStorage.getItem(storageKey(dateVal));
    allCheckboxes().forEach(cb => { cb.checked = false; cb.closest(".task").classList.remove("done"); });
    employeeInput.value = "";
    serviceInput.value = "";
    commentsInput.value = "";
    informManagerInput.checked = false;
    hideSuccess();
    if (raw) {
      const state = JSON.parse(raw);
      employeeInput.value = state.employee || "";
      serviceInput.value = state.service || "";
      commentsInput.value = state.comments || "";
      informManagerInput.checked = !!state.informManager;
      allCheckboxes().forEach(cb => {
        const key = cb.dataset.section + "|" + cb.dataset.path;
        if (state.checks && state.checks[key]) {
          cb.checked = true;
          cb.closest(".task").classList.add("done");
        }
      });
    }
    syncAllParents();
    updateProgress();
  }

  function buildReportBody() {
    const dateVal = dateInput.value || todayISO();
    const boxes = allCheckboxes();
    const done = boxes.filter(b => b.checked).length;
    const total = boxes.length;
    let lines = [];
    lines.push(LIST_TITLE + " — " + dateVal);
    lines.push("Employé : " + (employeeInput.value || "—"));
    lines.push("Service : " + (serviceInput.value || "—"));
    lines.push("Avancement : " + done + " / " + total + " tâches faites");
    lines.push("");
    Object.entries(DATA).forEach(([sectionName, rawTasks]) => {
      lines.push(sectionName.toUpperCase());
      const tasks = rawTasks.map(normalizeTask);
      const secKey = sectionName.replace(/\s+/g,"_");
      tasks.forEach((task, i) => {
        const cb = document.getElementById("t_" + secKey + "_" + i);
        lines.push((cb && cb.checked ? "[x] " : "[ ] ") + task.en);
        (task.sub || []).forEach((subItem, j) => {
          const subCb = document.getElementById("t_" + secKey + "_" + i + "_s" + j);
          lines.push("    " + (subCb && subCb.checked ? "[x] " : "[ ] ") + subItem.en);
        });
      });
      lines.push("");
    });
    const commentsVal = (commentsInput.value || "").trim();
    lines.push("COMMENTAIRES");
    lines.push(commentsVal || "(aucun)");
    return lines.join("\n");
  }

  function buildReportHtml() {
    const dateVal = dateInput.value || todayISO();
    const boxes = allCheckboxes();
    const done = boxes.filter(b => b.checked).length;
    const total = boxes.length;
    let html = '<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#1c1a17;">';
    html += '<h2 style="margin:0 0 8px;">' + LIST_TITLE + ' — ' + dateVal + '</h2>';
    html += '<p style="margin:0 0 4px;"><strong>Employé :</strong> ' + (employeeInput.value || '—') + '</p>';
    html += '<p style="margin:0 0 4px;"><strong>Service :</strong> ' + (serviceInput.value || '—') + '</p>';
    html += '<p style="margin:0 0 16px;"><strong>Avancement :</strong> ' + done + ' / ' + total + ' tâches faites</p>';
    Object.entries(DATA).forEach(([sectionName, rawTasks]) => {
      html += '<h3 style="margin:16px 0 6px;text-transform:uppercase;font-size:12px;letter-spacing:0.06em;color:#b3401f;">' + sectionName + '</h3>';
      const tasks = rawTasks.map(normalizeTask);
      const secKey = sectionName.replace(/\s+/g,"_");
      tasks.forEach((task, i) => {
        const cb = document.getElementById("t_" + secKey + "_" + i);
        const checked = !!(cb && cb.checked);
        const color = checked ? '#1c1a17' : '#c0392b';
        const weight = checked ? 'normal' : '700';
        const mark = checked ? '✓' : '✗';
        html += '<div style="color:' + color + ';font-weight:' + weight + ';margin:2px 0;">' + mark + ' ' + task.en + '</div>';
        (task.sub || []).forEach((subItem, j) => {
          const subCb = document.getElementById("t_" + secKey + "_" + i + "_s" + j);
          const subChecked = !!(subCb && subCb.checked);
          const subColor = subChecked ? '#8a8378' : '#c0392b';
          const subWeight = subChecked ? 'normal' : '700';
          const subMark = subChecked ? '✓' : '✗';
          html += '<div style="color:' + subColor + ';font-weight:' + subWeight + ';margin:2px 0 2px 20px;font-size:13px;">' + subMark + ' ' + subItem.en + '</div>';
        });
      });
    });
    const commentsVal = (commentsInput.value || "").trim();
    html += '<h3 style="margin:16px 0 6px;text-transform:uppercase;font-size:12px;letter-spacing:0.06em;color:#b3401f;">Commentaires</h3>';
    html += '<div>' + (commentsVal ? commentsVal.replace(/</g,'&lt;') : '(aucun)') + '</div>';
    html += '</div>';
    return html;
  }

  function isComplete() {
    const boxes = allCheckboxes();
    return boxes.length > 0 && boxes.every(b => b.checked);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm(I18N[currentLang].resetConfirm)) return;
    allCheckboxes().forEach(cb => { cb.checked = false; cb.closest(".task").classList.remove("done"); });
    hideSuccess();
    updateProgress();
    save();
  });

  function showSuccess() {
    successScreen.classList.add("visible");
  }
  function hideSuccess() {
    successScreen.classList.remove("visible");
  }
  document.getElementById("successCloseBtn").addEventListener("click", hideSuccess);

  document.getElementById("validateBtn").addEventListener("click", () => {
    save();
    const dateVal = dateInput.value || todayISO();
    const complete = isComplete();
    const inform = informManagerInput.checked;
    const commentsVal = (commentsInput.value || "").trim();
    if (complete && !inform && !commentsVal) {
      showSuccess();
      statusMsg.textContent = "";
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "log", listId: LIST_ID, date: dateVal, period: currentPeriod() }),
      }).catch(() => {});
      return;
    }
    let reasonTag = "signalée par l'employé";
    if (!complete) { reasonTag = "checklist incomplète"; }
    else if (commentsVal) { reasonTag = "commentaire signalé"; }
    const subjectPlain = "Alerte — " + LIST_TITLE + " — " + reasonTag + " — " + dateVal + " — " + (employeeInput.value || "Employé");
    const bodyPlain = buildReportBody();
    statusMsg.style.color = "var(--accent)";
    statusMsg.textContent = I18N[currentLang].alertSending;
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "alert", subject: subjectPlain, body: bodyPlain, htmlBody: buildReportHtml() }),
    }).then(() => {
      statusMsg.textContent = !complete ? I18N[currentLang].alertMissing : I18N[currentLang].alertInformed;
    }).catch(() => {
      const subject = encodeURIComponent(subjectPlain);
      const body = encodeURIComponent(bodyPlain);
      window.location.href = "mailto:" + RECIPIENTS + "?subject=" + subject + "&body=" + body;
      statusMsg.textContent = I18N[currentLang].alertFallback;
    });
  });

  dateInput.addEventListener("change", load);
  employeeInput.addEventListener("input", save);
  serviceInput.addEventListener("change", save);
  commentsInput.addEventListener("input", save);

  dateInput.value = todayISO();
  buildSections();
  load();
  applyLang(currentLang);
</script>
</body>
</html>
